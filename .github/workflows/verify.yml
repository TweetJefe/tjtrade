name: Build and startup verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp clean verify dependency:tree -Dverbose -DoutputFile=target/dependency-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            integration-tests/target/startup-logs/
            **/target/dependency-tree.txt
