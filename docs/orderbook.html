<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Live Orderbook (TJTrade)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e1e; color: #fff; padding: 20px; }
        .controls { margin-bottom: 20px; }
        button { padding: 10px 20px; margin-right: 10px; cursor: pointer; font-weight: bold; }
        #connectBtn { background-color: #4CAF50; color: white; border: none; }
        #disconnectBtn { background-color: #f44336; color: white; border: none; }
        .orderbook-container { display: flex; gap: 20px; margin-top: 20px; }
        .book-half { flex: 1; background: #2d2d2d; padding: 15px; border-radius: 8px; }
        h3 { margin-top: 0; text-align: center; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .ask { color: #ff5252; }
        .bid { color: #4caf50; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 8px; text-align: right; border-bottom: 1px solid #444; }
        th { text-align: center; color: #aaa; }
        #raw-log { margin-top: 20px; background: #000; padding: 10px; height: 150px; overflow-y: scroll; font-family: monospace; font-size: 12px; color: #0f0; }
    </style>
</head>
<body>

<h2>TJTrade Market Data - WebSocket Test</h2>

<div class="controls">
    <button id="connectBtn" onclick="connect()">Connect to WS</button>
    <button id="disconnectBtn" onclick="disconnect()" disabled>Disconnect</button>
    <span id="status" style="margin-left: 10px; color: #aaa;">Status: Disconnected</span>
</div>

<div class="orderbook-container">
    <div class="book-half">
        <h3 class="ask">Asks (Продавцы)</h3>
        <table>
            <thead><tr><th>Price</th><th>Volume</th></tr></thead>
            <tbody id="asks-body"></tbody>
        </table>
    </div>
    <div class="book-half">
        <h3 class="bid">Bids (Покупатели)</h3>
        <table>
            <thead><tr><th>Price</th><th>Volume</th></tr></thead>
            <tbody id="bids-body"></tbody>
        </table>
    </div>
</div>

<h4>Raw Messages Log:</h4>
<div id="raw-log"></div>

<script>
    let stompClient = null;

    function connect() {
        let socket = new SockJS('http://localhost:8085/ws');
        stompClient = Stomp.over(socket);

        stompClient.debug = null;

        stompClient.connect({}, function (frame) {
            document.getElementById('status').innerText = 'Status: CONNECTED!';
            document.getElementById('status').style.color = '#4CAF50';
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = false;
            logMsg("Connected: " + frame);

            // ИСПРАВЛЕНО: добавили /BTC_USD в путь подписки
            stompClient.subscribe('/topic/orderbook/BTC_USD', function (message) {
                logMsg(message.body);
                updateOrderbook(JSON.parse(message.body));
            });
        }, function(error) {
            logMsg("Connection error: " + error);
            disconnect();
        });
    }

    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect();
        }
        document.getElementById('status').innerText = 'Status: Disconnected';
        document.getElementById('status').style.color = '#aaa';
        document.getElementById('connectBtn').disabled = false;
        document.getElementById('disconnectBtn').disabled = true;
        logMsg("Disconnected");
    }

    function updateOrderbook(data) {
        const asksBody = document.getElementById('asks-body');
        const bidsBody = document.getElementById('bids-body');
        asksBody.innerHTML = '';
        bidsBody.innerHTML = '';

        if (data.asks) {
            data.asks.forEach(ask => {
                // ИСПРАВЛЕНО: ask.volume заменен на ask.quantity
                asksBody.innerHTML += `<tr><td class="ask">${ask.price}</td><td>${ask.quantity}</td></tr>`;
            });
        }

        if (data.bids) {
            data.bids.forEach(bid => {
                // ИСПРАВЛЕНО: bid.volume заменен на bid.quantity
                bidsBody.innerHTML += `<tr><td class="bid">${bid.price}</td><td>${bid.quantity}</td></tr>`;
            });
        }
    }

    function logMsg(msg) {
        const logDiv = document.getElementById('raw-log');
        logDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }
</script>
</body>
</html>
